name: Build and Test
on:
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        DISTRO: ["operaton", "tomcat", "wildfly"]
        PLATFORM: ["amd64"]
        JAVA_VERSION: ["17", "21", "25"]
    env:
      DISTRO: ${{ matrix.DISTRO }}
      PLATFORM: ${{ matrix.PLATFORM }}
      JAVA_VERSION: ${{ matrix.JAVA_VERSION }}
      SNAPSHOT: true
      IMAGE_REPO_OPERATON: operaton/operaton
      IMAGE_REPO_TOMCAT: operaton/tomcat
      IMAGE_REPO_WILDFLY: operaton/wildfly
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Old snapshot pre-releases get removed, so build against the newest one instead of a fixed version
      - name: Determine snapshot version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release list -R operaton/operaton --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$' | sed 's/-SNAPSHOT$//' | sort -V | tail -n1)
          if [ -z "$VERSION" ]; then
            echo "No snapshot pre-release found in operaton/operaton"
            exit 1
          fi
          echo "Using snapshot version ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ matrix.PLATFORM != 'amd64' }}
        with:
          platforms: ${{ matrix.PLATFORM }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Expose GitHub Runtime
        uses: actions/github-script@v7
        with:
          script: |
            Object.keys(process.env).forEach(function (key) {
              if (key.startsWith('ACTIONS_')) {
                core.info(`${key}=${process.env[key]}`);
                core.exportVariable(key, process.env[key]);
              }
            });
      - name: Build
        run: ./pipeline.sh
      - name: Test
        run: ./test.sh
        working-directory: test